<html>
<head>
<style>
  body {
    background-color: #0A0B10;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .balance-label {
    color: #8E929B;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .balance-amount {
    font-size: 40px;
    font-weight: bold;
    color: #3482F6;
  }
  .summary {
    display: flex;
    justify-content: space-between;
    margin-bottom: 40px;
    padding: 16px;
    background-color: #161821;
    border-radius: 16px;
  }
  .summary-item {
    text-align: center;
  }
  .summary-label {
    color: #8E929B;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .summary-amount {
    font-size: 16px;
    font-weight: 600;
  }
  .income {
    color: #2ECC71;
  }
  .expenses {
    color: #E74C3C;
  }
  .transactions-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .transaction-list {
    list-style: none;
    padding: 0;
  }
  .transaction-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid #161821;
  }
  .transaction-info .category {
    font-size: 16px;
    font-weight: 500;
  }
  .transaction-info .date {
    font-size: 12px;
    color: #8E929B;
    margin-top: 4px;
  }
  .transaction-amount {
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="balance-label">Balance Total</div>
    <div class="balance-amount">$ 1360.00</div>
  </div>
  <div class="summary">
    <div class="summary-item">
      <div class="summary-label">Ingresos</div>
      <div class="summary-amount income">+ $ 1790.00</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Gastos</div>
      <div class="summary-amount expenses">- $ 430.00</div>
    </div>
  </div>
  <div class="transactions-title">Movimientos</div>
  <ul class="transaction-list">
    <li class="transaction-item">
      <div class="transaction-info">
        <div class="category">Salario</div>
        <div class="date">22 de octubre</div>
      </div>
      <div class="transaction-amount income">+ $ 80.00</div>
    </li>
  </ul>
</div>
</body>
</html>
